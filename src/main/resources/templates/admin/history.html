<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>All Analysis History</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            width: 95%;
            margin: 40px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: #111827;
        }

        .dashboard-btn {
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
        }

        .dashboard-btn:hover {
            background: #0056b3;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #212529;
            color: white;
            padding: 14px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .match {
            color: #198754;
            font-weight: bold;
        }

        .missing {
            color: #dc3545;
            font-weight: bold;
        }

        .percentage {
            color: #0d6efd;
            font-weight: bold;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }

        .empty-box {
            background: white;
            padding: 60px;
            text-align: center;
            border-radius: 10px;
        }

        .empty-box h2 {
            color: #333;
        }

        .empty-box p {
            color: #777;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>All Analysis History</h1>

        <a th:href="@{/admin/dashboard}"
           class="dashboard-btn">

            Admin Dashboard

        </a>

    </div>


    <!-- ========================= -->
    <!-- HISTORY TABLE              -->
    <!-- ========================= -->

    <div class="table-box"
         th:if="${historyList != null and historyList.size() > 0}">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>User</th>

                <th>Email</th>

                <th>Resume</th>

                <th>Job</th>

                <th>Match %</th>

                <th>Matched Skills</th>

                <th>Missing Skills</th>

                <th>Analyzed At</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="history : ${historyList}">

                <!-- ID -->

                <td th:text="${history.id}">
                    1
                </td>


                <!-- USER -->

                <td>

                    <span
                        th:if="${history.user != null}"
                        th:text="${history.user.fullName}">

                        Prince

                    </span>

                    <span
                        th:if="${history.user == null}">

                        Unknown

                    </span>

                </td>


                <!-- EMAIL -->

                <td>

                    <span
                        th:if="${history.user != null}"
                        th:text="${history.user.email}">

                        user@gmail.com

                    </span>

                    <span
                        th:if="${history.user == null}">

                        -

                    </span>

                </td>


                <!-- RESUME -->

                <td th:text="${history.resumeFileName}">

                    prince.pdf

                </td>


                <!-- JOB -->

                <td th:text="${history.jobTitle}">

                    Java Developer

                </td>


                <!-- MATCH -->

                <td class="percentage">

                    <span
                        th:text="${history.matchPercentage + '%'}">

                        50%

                    </span>

                </td>


                <!-- MATCHED SKILLS -->

                <td class="match">

                    <span
                        th:if="${history.matchedSkills != null and history.matchedSkills != ''}"
                        th:text="${history.matchedSkills}">

                        Java, Spring Boot

                    </span>

                    <span
                        th:if="${history.matchedSkills == null or history.matchedSkills == ''}">

                        None

                    </span>

                </td>


                <!-- MISSING SKILLS -->

                <td class="missing">

                    <span
                        th:if="${history.missingSkills != null and history.missingSkills != ''}"
                        th:text="${history.missingSkills}">

                        React

                    </span>

                    <span
                        th:if="${history.missingSkills == null or history.missingSkills == ''}">

                        None

                    </span>

                </td>


                <!-- DATE -->

                <td th:text="${history.analyzedAt}">

                    2026-10-08

                </td>


                <!-- DELETE -->

                <td>

                    <form
                        th:action="@{/admin/history/delete}"
                        method="post">

                        <input
                            type="hidden"
                            name="id"
                            th:value="${history.id}">

                        <button
                            type="submit"
                            class="delete-btn"
                            onclick="return confirm('Are you sure you want to delete this analysis?');">

                            Delete

                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- ========================= -->
    <!-- EMPTY MESSAGE              -->
    <!-- ========================= -->

    <div class="empty-box"
         th:if="${historyList == null or historyList.size() == 0}">

        <h2>
            No Analysis History Found
        </h2>

        <p>
            No user has analyzed a resume yet.
        </p>

    </div>

</div>

</body>

</html>
