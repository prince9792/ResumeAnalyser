<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Users - Resume Analyser</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            color: #333;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            background: #212529;

            color: white;

            padding: 18px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .navbar h2 {

            font-size: 22px;
        }


        .logout-btn {

            text-decoration: none;

            background: #dc3545;

            color: white;

            padding: 9px 16px;

            border-radius: 6px;
        }


        .logout-btn:hover {

            background: #bb2d3b;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 95%;

            max-width: 1200px;

            margin: 35px auto;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .header h1 {

            font-size: 28px;

            color: #212529;
        }


        .back-btn {

            text-decoration: none;

            background: #0d6efd;

            color: white;

            padding: 10px 18px;

            border-radius: 6px;
        }


        .back-btn:hover {

            background: #0b5ed7;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            background: #fff3cd;

            color: #664d03;

            border: 1px solid #ffecb5;

            padding: 14px;

            border-radius: 6px;

            margin-bottom: 20px;
        }


        /* =========================
           TABLE
        ========================= */

        .table-container {

            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;
        }


        th {

            background: #212529;

            color: white;

            padding: 14px;

            text-align: left;
        }


        td {

            padding: 14px;

            border-bottom: 1px solid #ddd;
        }


        tr:hover {

            background: #f8f9fa;
        }


        /* =========================
           ROLE BADGES
        ========================= */

        .admin-badge {

            background: #0d6efd;

            color: white;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;
        }


        .user-badge {

            background: #6c757d;

            color: white;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;
        }


        /* =========================
           ROLE FORM
        ========================= */

        .role-form {

            display: flex;

            gap: 8px;

            align-items: center;
        }


        select {

            padding: 8px;

            border: 1px solid #ccc;

            border-radius: 5px;

            background: white;
        }


        .update-btn {

            border: none;

            background: #198754;

            color: white;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }


        .update-btn:hover {

            background: #157347;
        }


        /* =========================
           DELETE BUTTON
        ========================= */

        .delete-btn {

            border: none;

            background: #dc3545;

            color: white;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;
        }


        .delete-btn:hover {

            background: #bb2d3b;
        }


        /* =========================
           SELF
        ========================= */

        .self-label {

            color: #198754;

            font-weight: bold;

            font-size: 13px;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty-box {

            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 10px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .navbar {

                padding: 15px;
            }


            .container {

                width: 98%;
            }


            .header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }


            .role-form {

                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<!-- =================================
     NAVBAR
================================= -->

<nav class="navbar">

    <h2>
        Resume Analyser - Admin
    </h2>


    <a th:href="@{/logout}"
       class="logout-btn">

        Logout

    </a>

</nav>



<!-- =================================
     MAIN CONTAINER
================================= -->

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            Manage Users
        </h1>


        <a th:href="@{/admin/dashboard}"
           class="back-btn">

            ← Admin Dashboard

        </a>

    </div>



    <!-- =================================
         SELF ACTION ERROR
    ================================= -->

    <div class="message"
         th:if="${param.error != null and param.error[0] == 'self'}">

        You cannot change your own role
        or delete your own account.

    </div>



    <!-- =================================
         USERS TABLE
    ================================= -->

    <div class="table-container"
         th:if="${users != null and !users.isEmpty()}">


        <table>


            <thead>

            <tr>

                <th>ID</th>

                <th>Full Name</th>

                <th>Email</th>

                <th>Role</th>

                <th>Change Role</th>

                <th>Action</th>

            </tr>

            </thead>



            <tbody>


            <tr th:each="user : ${users}">


                <!-- ID -->

                <td th:text="${user.id}">
                    1
                </td>



                <!-- NAME -->

                <td th:text="${user.fullName}">
                    Prince Yadav
                </td>



                <!-- EMAIL -->

                <td th:text="${user.email}">
                    example@gmail.com
                </td>



                <!-- ROLE -->

                <td>

                    <span th:if="${user.role == 'ADMIN'}"
                          class="admin-badge">

                        ADMIN

                    </span>


                    <span th:if="${user.role != 'ADMIN'}"
                          class="user-badge">

                        USER

                    </span>

                </td>



                <!-- CHANGE ROLE -->

                <td>

                    <!-- Other users -->

                    <form th:if="${user.id != session.loggedInUser.id}"
                          th:action="@{/admin/users/update-role}"
                          method="post"
                          class="role-form">


                        <input type="hidden"
                               name="id"
                               th:value="${user.id}">


                        <select name="role">


                            <option value="USER"
                                    th:selected="${user.role == 'USER'}">

                                USER

                            </option>


                            <option value="ADMIN"
                                    th:selected="${user.role == 'ADMIN'}">

                                ADMIN

                            </option>


                        </select>


                        <button type="submit"
                                class="update-btn">

                            Update

                        </button>


                    </form>


                    <!-- Current Admin -->

                    <span th:if="${user.id == session.loggedInUser.id}"
                          class="self-label">

                        Current Account

                    </span>

                </td>



                <!-- DELETE -->

                <td>


                    <!-- Other users -->

                    <form th:if="${user.id != session.loggedInUser.id}"
                          th:action="@{/admin/users/delete}"
                          method="post">


                        <input type="hidden"
                               name="id"
                               th:value="${user.id}">


                        <button type="submit"
                                class="delete-btn"
                                onclick="return confirm('Are you sure you want to delete this user? All resume and analysis history of this user will also be deleted.');">

                            Delete

                        </button>


                    </form>


                    <!-- Current Admin -->

                    <span th:if="${user.id == session.loggedInUser.id}"
                          class="self-label">

                        Protected

                    </span>


                </td>


            </tr>


            </tbody>

        </table>

    </div>



    <!-- =================================
         NO USERS
    ================================= -->

    <div class="empty-box"
         th:if="${users == null or users.isEmpty()}">

        <h2>
            No Users Found
        </h2>

        <p>
            Currently there are no registered users.
        </p>

    </div>


</div>


</body>

</html>
