<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Resume Analyser</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        .register-container {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);
        }


        .title {

            text-align: center;

            margin-bottom: 10px;

            color: #222;

            font-size: 28px;
        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

            font-size: 14px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


        input:focus {

            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102, 126, 234, 0.15);
        }


        .error {

            color: #dc2626;

            font-size: 13px;

            margin-top: 6px;

            display: block;
        }


        .success {

            background: #dcfce7;

            color: #166534;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }


        .general-error {

            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }


        .register-btn {

            width: 100%;

            padding: 13px;

            background: #667eea;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .register-btn:hover {

            background: #5568d8;
        }


        .login-link {

            text-align: center;

            margin-top: 20px;

            color: #666;

            font-size: 14px;
        }


        .login-link a {

            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }


        .login-link a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="register-container">


    <!-- ============================= -->
    <!-- TITLE -->
    <!-- ============================= -->

    <h1 class="title">
        Resume Analyser
    </h1>


    <p class="subtitle">
        Create your account
    </p>


    <!-- ============================= -->
    <!-- SUCCESS MESSAGE -->
    <!-- ============================= -->

    <div
        class="success"
        th:if="${success}"
        th:text="${success}">
    </div>


    <!-- ============================= -->
    <!-- GENERAL ERROR -->
    <!-- ============================= -->

    <div
        class="general-error"
        th:if="${error}"
        th:text="${error}">
    </div>


    <!-- ============================= -->
    <!-- REGISTER FORM -->
    <!-- ============================= -->

    <form
        th:action="@{/register}"
        th:object="${user}"
        method="post">


        <!-- ============================= -->
        <!-- FULL NAME -->
        <!-- ============================= -->

        <div class="form-group">

            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                th:field="*{fullName}"
                placeholder="Enter your full name">


            <!-- Full Name Validation -->

            <div
                class="error"
                th:if="${#fields.hasErrors('fullName')}"
                th:errors="*{fullName}">
            </div>

        </div>


        <!-- ============================= -->
        <!-- EMAIL -->
        <!-- ============================= -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                th:field="*{email}"
                placeholder="Enter your email">


            <!-- Email Validation -->

            <div
                class="error"
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}">
            </div>

        </div>


        <!-- ============================= -->
        <!-- PASSWORD -->
        <!-- ============================= -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                th:field="*{password}"
                placeholder="Enter password">


            <!-- Password Validation -->

            <div
                class="error"
                th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}">
            </div>

        </div>


        <!-- ============================= -->
        <!-- REGISTER BUTTON -->
        <!-- ============================= -->

        <button
            type="submit"
            class="register-btn">

            Create Account

        </button>


    </form>


    <!-- ============================= -->
    <!-- LOGIN LINK -->
    <!-- ============================= -->

    <div class="login-link">

        Already have an account?

        <a href="/login">
            Login here
        </a>

    </div>


</div>


</body>

</html>
