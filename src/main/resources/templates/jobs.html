<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jobs - Resume Analyser</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .navbar {
            background: #007bff;
            color: white;
            padding: 18px 30px;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            width: 900px;
            max-width: 90%;
            margin: 40px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .job-card {
            background: white;
            margin-top: 20px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .job-card h2 {
            margin-top: 0;
        }

        .skills {
            color: #555;
        }

        .create-btn {
            background: #007bff;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

        .delete-btn {
            margin-top: 15px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .empty {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 10px;
        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <div class="navbar">

        <h2>Resume Analyser</h2>

    </div>


    <div class="container">

        <!-- Header -->

        <div class="top">

            <h1>Available Jobs</h1>

            <a th:href="@{/admin/job/create}"
               class="create-btn">
                + Create Job
            </a>

        </div>


        <!-- Jobs -->

        <div th:if="${jobs != null and !jobs.isEmpty()}">

            <div class="job-card"
                 th:each="job : ${jobs}">

                <h2 th:text="${job.jobTitle}">
                    Java Backend Developer
                </h2>

                <p>

                    <strong>
                        Required Skills:
                    </strong>

                </p>

                <p class="skills"
                   th:text="${job.requiredSkills}">
                </p>


                <!-- Delete Job -->

                <form th:action="@{/admin/job/delete}"
                      method="post"
                      style="display:inline;">

                    <input type="hidden"
                           name="id"
                           th:value="${job.id}">

                    <button type="submit"
                            class="delete-btn"
                            onclick="return confirm('Are you sure you want to delete this job?');">

                        Delete

                    </button>

                </form>

            </div>

        </div>


        <!-- No Jobs -->

        <div class="empty"
             th:if="${jobs == null or jobs.isEmpty()}">

            <p>
                No jobs available.
            </p>

        </div>

    </div>

</body>

</html>
