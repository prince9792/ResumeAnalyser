<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Resume - Resume Analyser</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Navbar */

        .navbar {
            background: #007bff;
            color: white;
            padding: 18px 30px;
        }

        .navbar h2 {
            margin: 0;
        }

        /* Main Container */

        .container {
            width: 700px;
            max-width: 90%;
            margin: 50px auto;
        }

        /* Upload Box */

        .upload-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
        }

        /* File Input */

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* Upload Button */

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        /* Success Message */

        .success {
            color: green;
            margin-top: 20px;
        }

        /* Error Message */

        .error {
            color: red;
            margin-top: 20px;
        }

        /* Extracted Text */

        .text-box {
            margin-top: 30px;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
        }

        /* Detected Skills */

        .skills-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .skills-box h3 {
            margin-top: 0;
        }

        .skills-box ul {
            padding-left: 20px;
        }

        .skills-box li {
            margin-bottom: 8px;
            color: #007bff;
            font-weight: bold;
        }

        /* Back */

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <div class="navbar">

        <h2>Resume Analyser</h2>

    </div>


    <!-- Main Container -->

    <div class="container">

        <div class="upload-box">

            <h1>Upload Your Resume</h1>

            <p>
                Upload your resume in PDF format.
            </p>


            <!-- Upload Form -->

            <form th:action="@{/upload-resume}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="file"
                       name="file"
                       accept=".pdf"
                       required>

                <br>

                <button type="submit">
                    Upload Resume
                </button>

            </form>


            <!-- Success Message -->

            <p class="success"
               th:if="${success}"
               th:text="${success}">
            </p>


            <!-- Error Message -->

            <p class="error"
               th:if="${error}"
               th:text="${error}">
            </p>


            <!-- Uploaded File Name -->

            <div th:if="${fileName}">

                <h3>Uploaded File:</h3>

                <p th:text="${fileName}"></p>

            </div>


            <!-- Extracted Resume Text -->

            <div class="text-box"
                 th:if="${extractedText}">

                <h3>
                    Extracted Resume Text
                </h3>

                <textarea
                    th:text="${extractedText}"
                    readonly>
                </textarea>

            </div>


            <!-- Detected Skills -->

            <div class="skills-box"
                 th:if="${skills != null}">

                <h3>
                    Detected Skills
                </h3>

                <ul>

                    <li th:each="skill : ${skills}"
                        th:text="${skill}">
                    </li>

                </ul>

                <p th:if="${skills.isEmpty()}">
                    No known skills detected in your resume.
                </p>

            </div>


            <!-- Back To Dashboard -->

            <a href="/dashboard"
               class="back">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</body>

</html>
