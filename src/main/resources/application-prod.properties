# Application Configuration

spring.application.name=ResumeAnalyser
server.port=${PORT:8080}

# Database Configuration

spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=verify-full
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate Configuration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Hide sensitive database connection details from Hibernate logs

logging.level.org.hibernate.orm.connections.pooling=ERROR

# Thymeleaf Configuration

spring.thymeleaf.cache=true

# File Upload Configuration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration

server.servlet.session.timeout=30m

# Error Configuration

server.error.whitelabel.enabled=false
